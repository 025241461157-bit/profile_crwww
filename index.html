<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil</title>
<style>
  :root {
    --ink: #f1efff;
    --dim: rgba(241, 239, 255, 0.55);
    --line: rgba(241, 239, 255, 0.14);
    --cyan: #00f0ff;
    --pink: #ff2d95;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #03000b;
    min-height: 100vh;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Latar ===== */
  .nebula { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(100px); mix-blend-mode: screen; }
  .b1 { width: 58vmax; height: 58vmax; background: #6a1fe0; top: -22%; left: -15%; opacity: .55; animation: d1 24s ease-in-out infinite alternate; }
  .b2 { width: 44vmax; height: 44vmax; background: #ff2d95; top: 10%; right: -18%; opacity: .32; animation: d2 30s ease-in-out infinite alternate; }
  .b3 { width: 50vmax; height: 50vmax; background: #0a7bff; bottom: -28%; left: 20%; opacity: .42; animation: d3 36s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(20vw, 14vh) scale(1.2); } }
  @keyframes d2 { to { transform: translate(-22vw, 18vh) scale(.85); } }
  @keyframes d3 { to { transform: translate(16vw, -18vh) scale(1.25); } }

  #fx { position: fixed; inset: 0; z-index: 1; }

  /* ===== Konten minimalis ===== */
  .stage {
    position: relative; z-index: 3;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    width: 100%; max-width: 480px;
    pointer-events: auto;
    isolation: isolate;
  }
  /* bayangan gelap lembut agar teks tetap terbaca di atas efek ramai */
  .wrap::before {
    content: ""; position: absolute; inset: -80px -70px; z-index: -1;
    background: radial-gradient(ellipse at center, rgba(3, 0, 11, .72) 0%, rgba(3, 0, 11, .45) 45%, transparent 72%);
    pointer-events: none;
  }

  /* Banner foto: selebar kolom konten, tinggi lebih pendek (seperti banner Discord/TikTok) */
  .banner {
    width: 100%;
    height: 150px;               /* ubah untuk mengatur tinggi banner */
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
    margin-bottom: 30px;
    background: linear-gradient(135deg, #6a1fe0, #ff2d95 60%, #00f0ff); /* tampil jika foto belum ada */
    box-shadow: 0 0 30px rgba(138, 92, 255, .25);
    animation: rise .9s ease both;
  }
  .banner img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;           /* foto dipotong otomatis, tidak perlu rasio khusus */
    object-position: center;     /* atur fokus: center top / center bottom / dll */
  }

  h1 {
    font-size: clamp(44px, 9vw, 72px);
    font-weight: 200;
    letter-spacing: -.03em;
    line-height: 1;
    margin-bottom: 14px;
    animation: rise .9s .1s ease both;
  }

  .role {
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 26px;
    animation: rise .9s .2s ease both;
  }

  .about {
    font-size: 15px; line-height: 1.8; color: var(--dim); font-weight: 300;
    margin-bottom: 40px;
    animation: rise .9s .3s ease both;
  }

  .skills { margin-bottom: 40px; animation: rise .9s .4s ease both; }
  .skill { margin-bottom: 20px; }
  .skill-top {
    display: flex; justify-content: space-between;
    font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim);
    margin-bottom: 9px;
  }
  .skill-top span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }

  .bar { position: relative; height: 2px; background: var(--line); }
  .fill {
    position: relative; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--cyan), #8a5cff, var(--pink));
    transition: width 1.6s cubic-bezier(.2, .8, .2, 1);
    box-shadow: 0 0 12px rgba(0, 240, 255, .55);
  }
  /* titik cahaya di ujung bar */
  .fill::after {
    content: ""; position: absolute; right: -4px; top: 50%;
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff; transform: translateY(-50%);
    box-shadow: 0 0 14px 3px var(--pink);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: translateY(-50%) scale(1.5); opacity: .7; } }
  .skill:hover .fill { box-shadow: 0 0 20px rgba(0, 240, 255, .9); }

  .contact {
    display: flex; flex-wrap: wrap; gap: 6px 22px;
    font-size: 12.5px; color: var(--dim); letter-spacing: .05em;
    padding-top: 22px; border-top: 1px solid var(--line);
    animation: rise .9s .5s ease both;
  }

  .hint {
    position: fixed; z-index: 4; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 10.5px; letter-spacing: .35em; text-transform: uppercase; color: rgba(241,239,255,.35);
    pointer-events: none; animation: fade 4s 2s ease both;
  }
  @keyframes fade { 0% { opacity: 0; } 20%, 80% { opacity: 1; } 100% { opacity: .35; } }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  @media (max-width: 520px) {
    body { overflow-y: auto; }
    .wrap::before { inset: -50px -30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .fill::after { animation: none; }
  }
</style>
</head>
<body>

<div class="nebula"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="fx"></canvas>

<main class="stage">
  <div class="wrap">
    <!-- Banner foto: ganti foto.jpg dengan nama file fotomu -->
    <div class="banner"><img src="foto.jpg" alt="Banner profil"></div>

    <h1>Nama Anda</h1>
    <div class="role">Web Developer</div>

    <p class="about">Pengembang web yang suka membuat tampilan sederhana tapi berkesan. Senang belajar teknologi baru dan bekerja sama dalam tim.</p>

    <div class="skills">
      <div class="skill">
        <div class="skill-top"><span>HTML</span><span>90%</span></div>
        <div class="bar"><div class="fill" data-level="90"></div></div>
      </div>
      <div class="skill">
        <div class="skill-top"><span>CSS</span><span>85%</span></div>
        <div class="bar"><div class="fill" data-level="85"></div></div>
      </div>
      <div class="skill">
        <div class="skill-top"><span>JavaScript</span><span>75%</span></div>
        <div class="bar"><div class="fill" data-level="75"></div></div>
      </div>
      <div class="skill">
        <div class="skill-top"><span>Python</span><span>65%</span></div>
        <div class="bar"><div class="fill" data-level="65"></div></div>
      </div>
      <div class="skill">
        <div class="skill-top"><span>UI/UX Design</span><span>70%</span></div>
        <div class="bar"><div class="fill" data-level="70"></div></div>
      </div>
    </div>

    <div class="contact">
      <span>nama@email.com</span>
      <span>+62 812-3456-7890</span>
      <span>Yogyakarta, ID</span>
    </div>
  </div>
</main>

<div class="hint">gerakkan kursor · klik di mana saja ✦</div>

<script>
  /* ===== Bar kemampuan ===== */
  window.addEventListener("load", function () {
    setTimeout(function () {
      document.querySelectorAll(".fill").forEach(function (b, i) {
        setTimeout(function () { b.style.width = b.dataset.level + "%"; }, i * 160);
      });
    }, 500);
  });

  /* ===== Efek ramai di canvas ===== */
  (function () {
    var canvas = document.getElementById("fx");
    var ctx = canvas.getContext("2d");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var W, H;

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    /* --- Input: parallax, percikan, ledakan --- */
    var mx = 0, my = 0, tx = 0, ty = 0;
    var particles = [];

    function spark(x, y, burst) {
      var n = burst ? 46 : 2;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = burst ? Math.random() * 5.5 + 1 : Math.random() * 1.2 + 0.2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (burst ? 0 : 0.3),
          g: burst ? 0.05 : 0.01,
          life: 1,
          decay: burst ? 0.011 + Math.random() * 0.01 : 0.02 + Math.random() * 0.02,
          size: Math.random() * 2 + 0.8,
          hue: Math.random() * 140 + 190
        });
      }
      if (particles.length > 700) particles.splice(0, particles.length - 700);
    }

    window.addEventListener("pointermove", function (e) {
      tx = e.clientX / W - 0.5; ty = e.clientY / H - 0.5;
      if (!reduce) spark(e.clientX, e.clientY, false);
    });
    window.addEventListener("pointerdown", function (e) {
      if (!reduce) spark(e.clientX, e.clientY, true);
    });

    /* --- Bintang --- */
    var stars = [];
    for (var i = 0; i < 320; i++) {
      stars.push({
        x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2,
        r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.28, sp: Math.random() * 2.2 + 0.5,
        tint: Math.random() < 0.2 ? "255,214,245" : (Math.random() < 0.3 ? "200,220,255" : "255,255,255")
      });
    }

    /* --- Galaksi spiral --- */
    var spiral = [];
    for (var j = 0; j < 1800; j++) {
      var arm = Math.floor(Math.random() * 3);
      var d = Math.pow(Math.random(), 0.65);
      spiral.push({
        d: d,
        angle: d * 5.2 + arm * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.55 * (1.2 - d),
        size: Math.random() * 1.5 + 0.3,
        hue: 270 + d * 70 + Math.random() * 25,
        alpha: Math.random() * 0.5 + 0.2
      });
    }

    /* --- Kunang-kunang kosmik --- */
    var flies = [];
    for (var f = 0; f < 50; f++) {
      flies.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4, vy: -Math.random() * 0.35 - 0.05,
        ph: Math.random() * 6.28, hue: Math.random() * 120 + 180
      });
    }

    /* --- Bintang jatuh --- */
    var shooters = [];
    function shoot() {
      var left = Math.random() < 0.5;
      shooters.push({
        x: Math.random() * W * 0.8 + (left ? 0 : W * 0.2), y: Math.random() * H * 0.45,
        vx: (Math.random() * 7 + 9) * (left ? 1 : -1), vy: Math.random() * 3 + 4, life: 1
      });
    }

    /* --- Aurora --- */
    var auroraCols = [[0, 240, 255], [138, 92, 255], [255, 45, 149]];
    function aurora(t) {
      ctx.globalCompositeOperation = "lighter";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      for (var r = 0; r < 3; r++) {
        var c = auroraCols[r];
        var layers = [[70, 0.035], [36, 0.05], [12, 0.09]];
        for (var l = 0; l < layers.length; l++) {
          ctx.beginPath();
          for (var x = 0; x <= W + 24; x += 24) {
            var y = H * (0.8 - r * 0.08)
              + Math.sin(x * 0.004 + t * (0.25 + r * 0.1) + r * 2) * 42
              + Math.sin(x * 0.011 - t * 0.4) * 14;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + layers[l][1] + ")";
          ctx.lineWidth = layers[l][0];
          ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = "source-over";
    }

    /* --- Planet mengorbit --- */
    function planet(cx, cy, r, c1, c2, ring) {
      if (ring) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(-0.4);
        ctx.strokeStyle = "rgba(255,214,245,0.35)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, Math.PI, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      var g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.shadowColor = c1; ctx.shadowBlur = r * 0.8;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (ring) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(-0.4);
        ctx.strokeStyle = "rgba(255,214,245,0.55)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, 0, Math.PI); ctx.stroke();
        ctx.restore();
      }
    }

    function frame(ms) {
      var t = ms / 1000;
      mx += (tx - mx) * 0.05; my += (ty - my) * 0.05;
      ctx.clearRect(0, 0, W, H);

      /* galaksi */
      var cx = W * 0.5 - mx * 30, cy = H * 0.5 - my * 30;
      var R = Math.min(W, H) * 0.66;
      var tilt = -0.45, ct = Math.cos(tilt), st = Math.sin(tilt), rot = t * 0.045;

      var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.45);
      core.addColorStop(0, "rgba(255,230,255,0.32)");
      core.addColorStop(0.3, "rgba(190,110,255,0.17)");
      core.addColorStop(1, "rgba(80,40,200,0)");
      ctx.fillStyle = core; ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < spiral.length; k++) {
        var p = spiral[k];
        var a = p.angle + rot * (1.4 - p.d);
        var px = Math.cos(a) * p.d * R, py = Math.sin(a) * p.d * R * 0.42;
        ctx.fillStyle = "hsla(" + p.hue + ",90%,70%," + p.alpha + ")";
        ctx.beginPath();
        ctx.arc(cx + px * ct - py * st, cy + px * st + py * ct, p.size, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      /* aurora */
      aurora(t);

      /* planet */
      var a1 = t * 0.07;
      planet(W * 0.5 + Math.cos(a1) * W * 0.38, H * 0.5 + Math.sin(a1) * H * 0.3 - 20,
             20 + Math.sin(a1) * 6, "#ffb86b", "#8a2b0e", false);
      var a2 = t * 0.045 + 2.4;
      planet(W * 0.5 + Math.cos(a2) * W * 0.42, H * 0.5 + Math.sin(a2) * H * 0.34,
             26 + Math.sin(a2) * 8, "#9fb8ff", "#2a2f8f", true);

      /* bintang */
      for (var s = 0; s < stars.length; s++) {
        var q = stars[s];
        var sx = q.x * W + mx * q.z * 60, sy = q.y * H + my * q.z * 60;
        var tw = reduce ? 1 : 0.55 + 0.45 * Math.sin(t * q.sp + q.ph);
        ctx.fillStyle = "rgba(" + q.tint + "," + (tw * q.z).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(sx, sy, q.r * q.z, 0, 6.2832); ctx.fill();
        if (q.r > 1.2 && tw > 0.9) {
          ctx.strokeStyle = "rgba(" + q.tint + ",0.4)"; ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(sx - 6, sy); ctx.lineTo(sx + 6, sy);
          ctx.moveTo(sx, sy - 6); ctx.lineTo(sx, sy + 6);
          ctx.stroke();
        }
      }

      /* kunang-kunang */
      ctx.globalCompositeOperation = "lighter";
      for (var n = 0; n < flies.length; n++) {
        var fl = flies[n];
        fl.x += fl.vx + Math.sin(t + fl.ph) * 0.25; fl.y += fl.vy;
        if (fl.y < -10) { fl.y = H + 10; fl.x = Math.random() * W; }
        if (fl.x < -10) fl.x = W + 10; if (fl.x > W + 10) fl.x = -10;
        var al = 0.35 + 0.35 * Math.sin(t * 1.5 + fl.ph);
        ctx.fillStyle = "hsla(" + fl.hue + ",100%,70%," + (al * 0.25).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(fl.x, fl.y, 8, 0, 6.2832); ctx.fill();
        ctx.fillStyle = "hsla(" + fl.hue + ",100%,85%," + al.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(fl.x, fl.y, 1.6, 0, 6.2832); ctx.fill();
      }

      /* bintang jatuh */
      if (!reduce && Math.random() < 0.022) shoot();
      for (var m = shooters.length - 1; m >= 0; m--) {
        var sh = shooters[m];
        sh.x += sh.vx; sh.y += sh.vy; sh.life -= 0.015;
        if (sh.life <= 0) { shooters.splice(m, 1); continue; }
        var g = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 11, sh.y - sh.vy * 11);
        g.addColorStop(0, "rgba(255,255,255," + sh.life + ")");
        g.addColorStop(1, "rgba(150,120,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - sh.vx * 11, sh.y - sh.vy * 11); ctx.stroke();
      }

      /* percikan dari kursor & ledakan klik */
      for (var u = particles.length - 1; u >= 0; u--) {
        var pt = particles[u];
        pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.g; pt.life -= pt.decay;
        if (pt.life <= 0) { particles.splice(u, 1); continue; }
        ctx.fillStyle = "hsla(" + pt.hue + ",100%,72%," + pt.life.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * pt.life + 0.3, 0, 6.2832); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>

</body>
</html>
